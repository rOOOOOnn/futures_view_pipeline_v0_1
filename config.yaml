timezone: Asia/Shanghai

browser:
  headless: true
  wait_ms: 2500
  debug: true
  max_pages: 8

sources:
  gfqh:
    enabled: true
    company: 广发期货
    mode: official_daily_review_png_ocr
    start_url: https://rd.gfqh.cn/RDInformation/menu/235

  citicsf:
    enabled: true
    company: 中信期货
    mode: official_web
    start_url: https://inst.citicsf.com/research-report/researchReportQuery

  gtjaqh:
    enabled: true
    company: 国泰海通期货
    mode: official_title_only
    start_url: https://www.gtjaqh.com/pc/report?catType=&page=1

  dzqh_public:
    enabled: true
    company: 东证期货
    mode: llm_public_search
    # 东证不爬受限官网：由联网 LLM 按专用 Prompt 检索公开报道/可靠转载。

llm_web:
  enabled: true
  provider: yuanbao
  url: "https://yuanbao.tencent.com/"
  profile_dir: browser_profile/llm
  headed: true
  new_chat_each_company: true
  response_timeout_seconds: 600
  response_stable_seconds: 15
  minimum_response_wait_seconds: 15
  cooldown_between_companies_seconds: 3
  max_submissions_per_run: 4
  deep_thinking: true
  allow_anonymous: true
  prompt_delivery: auto
  prompt_upload_threshold_chars: 6000
  attachment_ready_timeout_seconds: 60
  attachment_settle_seconds: 5
  attachment_upload_attempts: 3
  resume_successful_parts: true
  # 网页改版时通常只需要改这里，不改采集层。
  input_selectors:
    - '.ql-editor[contenteditable="true"]'
    - 'textarea'
    - '[contenteditable="true"]'
  add_attachment_selectors:
    - 'button[aria-label="添加"]'
    - '[role="button"][aria-label="添加"]'
    - 'button:has-text("添加")'
  upload_file_option_selectors:
    - 'button:has-text("本地文件")'
    - '[role="menuitem"]:has-text("本地文件")'
    - '[role="button"]:has-text("本地文件")'
    - 'text="本地文件"'
    - 'button:has-text("上传文件")'
    - '[role="menuitem"]:has-text("上传文件")'
    - '[role="button"]:has-text("上传文件")'
    - 'text="上传文件"'
  send_selectors:
    - '[class*="send-btn"]'
    - '[class*="send-button"]'
    - 'button[aria-label*="Send"]'
    - 'button[aria-label*="发送"]'
    - 'button[type="submit"]'
  deep_thinking_selectors:
    - 'button:has-text("深度思考")'
    - '[role="button"]:has-text("深度思考")'
    - '[class*="deep-think"]'
    - '[class*="deepthink"]'
  model_switch_selectors:
    - 'button[aria-label="切换模型"]'
    - '[role="button"][aria-label="切换模型"]'
    - 'button:has-text("快速回答")'
  deep_thinking_option_selectors:
    - 'button:has-text("深度思考")'
    - '[role="menuitem"]:has-text("深度思考")'
    - '[role="option"]:has-text("深度思考")'
    - 'text="深度思考"'
  generating_selectors:
    - 'text="思考中"'
    - '[class*="reasoner"]:has-text("思考中")'
    - 'button:has-text("停止生成")'
    - 'button[aria-label*="停止"]'
    - '[class*="stop-btn"]'
    - '[class*="generating"]'
  assistant_message_selectors:
    - '[class*="agent-chat__conv--ai"]'
    - '[class*="agent-chat__message--ai"]'
    - '[class*="message-content"]'
    - '[data-message-author-role="assistant"]'
    - '.assistant-message'
    - '.markdown'
  new_chat_selectors:
    - '.yb-new-chat-entry__item:has-text("新对话")'
    - 'text="新对话"'
    - '[title="新建对话"]'
    - '[aria-label="新建对话"]'
    - 'a[href*="new"]'
    - 'button[aria-label*="New chat"]'
    - 'button[aria-label*="新建"]'

llm_api:
  provider: tokenhub
  # 普通分类按API Key实际开通地域选择：
  # 广州(中国大陆): https://tokenhub.tencentmaas.com/v1
  # 新加坡(全球):   https://tokenhub-intl.tencentmaas.com/v1
  # 两站Key不互通；此处保留当前已验证的新加坡配置。
  base_url: "https://tokenhub-intl.tencentmaas.com/v1"
  # 联网搜索当前仅支持广州，因此东证发现阶段固定使用广州入口。
  search_base_url: "https://tokenhub.tencentmaas.com/v1"
  search_api_key_env: "TENCENT_TOKENHUB_SEARCH_API_KEY"
  search_api_key_file: "secrets/tokenhub_search_api_key.txt"
  api_key_env: "TENCENT_TOKENHUB_API_KEY"
  api_key_file: "secrets/tokenhub_api_key.txt"
  model: "hy3"
  # 20-40条结构化观点通常只需约4k-7k；限制异常重复输出和无谓费用。
  max_output_tokens: 10000
  reasoning: false
  dzqh_web_search: true
  dzqh_search_source: "standard"
