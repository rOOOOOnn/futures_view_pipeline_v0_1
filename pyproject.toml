[project]
name = "futures-view-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.46.0",
  "pypdf>=5.0.0",
  "python-dateutil>=2.9.0",
  "PyYAML>=6.0.1",
  "openpyxl>=3.1.5",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
